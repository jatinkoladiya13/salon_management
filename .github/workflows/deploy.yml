name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # ============================================================
      # 1. Checkout code
      # ============================================================
      - name: Reclaim workspace ownership
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Never run git clean here: media/ contains user uploads.
          clean: false
          fetch-depth: 0

      # ============================================================
      # 2. Create environment file
      # ============================================================
      - name: Create environment file
        run: |
          cat > "$ENV_TMP" << 'EOF'

          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          CHANNELS_ALLOWED_ORIGINS=${{ secrets.CHANNELS_ALLOWED_ORIGINS }}
          CHANNELS_ALLOW_MISSING_ORIGIN=${{ secrets.CHANNELS_ALLOW_MISSING_ORIGIN }}
          DEBUG=${{ secrets.DEBUG }}

          DEFAULT_DB_NAME=${{ secrets.DEFAULT_DB_NAME }}
          DEFAULT_DB_USER=${{ secrets.DEFAULT_DB_USER }}
          DEFAULT_DB_PASSWORD=${{ secrets.DEFAULT_DB_PASSWORD }}
          DEFAULT_DB_HOST=${{ secrets.DEFAULT_DB_HOST }}
          DEFAULT_DB_PORT=${{ secrets.DEFAULT_DB_PORT }}

          ACCESS_TOKEN_EXPIRE_TIME_IN_MIN=${{ secrets.ACCESS_TOKEN_EXPIRE_TIME_IN_MIN }}
          REFRESH_TOKEN_EXPIRE_TIME_IN_MIN=${{ secrets.REFRESH_TOKEN_EXPIRE_TIME_IN_MIN }}

          HTTP_PROXY=${{ secrets.HTTP_PROXY }}
          HOST_URI=${{ secrets.HOST_URI }}
          
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_CHANNEL=${{ secrets.REDIS_CHANNEL }}

          SUPERUSER_USERNAME=${{ secrets.SUPERUSER_USERNAME }}
          SUPERUSER_EMAIL=${{ secrets.SUPERUSER_EMAIL }}
          SUPERUSER_PASSWORD=${{ secrets.SUPERUSER_PASSWORD }}

          ELASTIC_CLOUD_ID=${{ secrets.ELASTIC_CLOUD_ID }}
          ELASTIC_API_KEY=${{ secrets.ELASTIC_API_KEY }}
          ELASTIC_USERNAME=${{ secrets.ELASTIC_USERNAME }}
          ELASTIC_PASSWORD=${{ secrets.ELASTIC_PASSWORD }}

          STRIPE_LIVE_MODE=${{ secrets.STRIPE_LIVE_MODE }}
          STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          DJSTRIPE_WEBHOOK_SECRET=${{ secrets.DJSTRIPE_WEBHOOK_SECRET }}

          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}
          DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}

          AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}
          AWS_S3_REGION_NAME=${{ secrets.AWS_S3_REGION_NAME }}

          EOF

          # CRITICAL: `base64` wraps at 76 cols by default, so the secret value
          # may itself be multi-line. A multi-line value can't live on one
          # KEY=VALUE line — both the .env parser and docker-compose's env_file
          # keep only the first line and silently drop the rest, so the key
          # decodes to garbage and the bridge sees "no key". Capture it via a
          # file (heredocs preserve newlines) and collapse ALL whitespace to a
          # single line before appending to .env.
          BRIDGE_KEY_TMP="$(mktemp)"
          cat > "$BRIDGE_KEY_TMP" << 'B64EOF'
          ${{ secrets.BRIDGE_SIGNING_PRIVATE_KEY_B64 }}
          B64EOF
          echo "BRIDGE_SIGNING_PRIVATE_KEY_B64=$(tr -d '[:space:]' < "$BRIDGE_KEY_TMP")" >> "$ENV_TMP"
          rm -f "$BRIDGE_KEY_TMP"

          # Verify .env file exists and has content
          if [ ! -f ".env" ] || [ ! -s ".env" ]; then
            echo "Error: .env file missing or empty!"
            exit 1
          fi

          echo ".env file created successfully from individual GitHub secrets"
          echo "Environment variables count: $(grep -c "=" .env)"
      
      # ============================================================
      # 4. Build and start services with Docker Compose
      # ============================================================
      - name: Build and start services with Docker Compose
        run: |
          echo "Building and starting services..."
          sudo docker compose up -d --build


      # ============================================================
      # 5. Wait for services to be ready
      # ============================================================
      - name: Wait for services to be ready
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          echo "Waiting for services to start..."
          sleep 15

          echo "Checking if services are running..."
          sudo docker compose ps

          echo "Checking service logs..."
          sudo docker compose logs web --tail=50


      # ============================================================
      # 6. Run database migrations
      # ============================================================
      - name: Run database migrations
        run: |
          echo "Database migrations are handled in the container startup script"
          echo "Checking if migrations completed successfully..."
          sleep 10

      # ============================================================
      # 7. Check service status
      # ============================================================
      - name: Check service status
        run: |
          echo "======================================"
          echo "Docker Compose Service Status"
          echo "======================================"

          sudo docker compose ps

          echo ""
          echo "======================================"
          echo "Docker Compose Logs"
          echo "======================================"

          sudo docker compose logs --tail=100

          echo ""
          echo "======================================"
          echo "Cleaning unused Docker images"
          echo "======================================"

          sudo docker image prune -f 

      
name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # ============================================================
      # 1. Checkout code
      # ============================================================
      - name: Reclaim workspace ownership
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Never run git clean here: media/ contains user uploads.
          clean: false
          fetch-depth: 0

      # ============================================================
      # 2. Create environment file
      # ============================================================
      - name: Create environment file
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}

        run: |
          set -Eeuo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH variable is required}"

          if [ ! -d "${DEPLOY_PATH}" ]; then
            echo "Deploy directory does not exist: ${DEPLOY_PATH}"
            sudo -n mkdir -p "${DEPLOY_PATH}"
          fi

          cd "${DEPLOY_PATH}"

          if [ -z "${ENV_FILE:-}" ]; then
            echo "ERROR: ENV_FILE secret is empty or not configured"
            exit 1
          fi

          printf '%s\n' "$ENV_FILE" > .env
          chmod 600 .env

          if [ ! -s .env ]; then
            echo "ERROR: .env file was not created or is empty"
            exit 1
          fi

          for required_key in \
            SECRET_KEY \
            DEFAULT_DB_NAME \
            DEFAULT_DB_USER \
            DEFAULT_DB_PASSWORD \
            DEFAULT_DB_HOST \
            DEFAULT_DB_PORT \
            REDIS_HOST \
            REDIS_PORT \
            REDIS_CHANNEL \
            ACCESS_TOKEN_EXPIRE_TIME_IN_MIN \
            REFRESH_TOKEN_EXPIRE_TIME_IN_MIN; do
            if ! grep -Eq "^[[:space:]]*${required_key}=" .env; then
              echo "ERROR: Missing required .env key: ${required_key}"
              exit 1
            fi
          done

          echo ".env file created successfully"
      
      # ============================================================
      # 3. Build and start services with Docker Compose
      # ============================================================
      - name: Build and start services with Docker Compose
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

        run: |
          set -Eeuo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH variable is required}"
          cd "${DEPLOY_PATH}"

          echo "Checking Docker Compose configuration..."
          sudo -n docker compose config --quiet

          echo "Building and starting services..."
          sudo -n docker compose up -d --build --remove-orphans


      # ============================================================
      # 4. Wait for services to be ready
      # ============================================================
      - name: Wait for services to be ready
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

        run: |
          set -eu

          cd "${DEPLOY_PATH}"

          echo "Waiting for services to start..."

          sleep 15

          echo "Current service status:"

          sudo -n docker compose ps


      # ============================================================
      # 5. Run database migrations
      # ============================================================
      - name: Run database migrations
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

        run: |
          set -Eeuo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH variable is required}"
          cd "${DEPLOY_PATH}"

          echo "Running shared tenant migrations..."
          sudo -n docker compose exec -T web python manage.py migrate_schemas --shared

          echo "Running tenant migrations..."
          sudo -n docker compose exec -T web python manage.py migrate_schemas --tenant

          echo "Database migrations completed successfully"


      # ============================================================
      # 6. Check service status
      # ============================================================
      - name: Check service status
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

        run: |
          set -eu

          cd "${DEPLOY_PATH}"

          echo "======================================"
          echo "Docker Compose Service Status"
          echo "======================================"

          sudo -n docker compose ps

          echo ""
          echo "======================================"
          echo "Docker Compose Logs"
          echo "======================================"

          sudo -n docker compose logs --tail=100

          echo ""
          echo "======================================"
          echo "Cleaning unused Docker images"
          echo "======================================"

          sudo -n docker image prune -f 

      
name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository without cleaning uploads
        uses: actions/checkout@v4
        with:
          # Never run git clean here: media/ contains user uploads.
          clean: false
          fetch-depth: 0

      - name: Deploy application
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -eu

          show_logs() {
            echo "===== docker compose ps ====="
            sudo -n docker compose ps || true
            echo "===== docker compose logs (last 200 lines) ====="
            sudo -n docker compose logs --tail=200 || true
          }

          trap show_logs EXIT

          cd "${DEPLOY_PATH:-$GITHUB_WORKSPACE}"

          if ! sudo -n true; then
            echo "The GitHub runner user needs passwordless sudo access for Docker"
            exit 1
          fi

          if [ -z "${ENV_FILE:-}" ]; then
            echo "ENV_FILE secret is empty or not configured"
            exit 1
          fi

          printf '%s\n' "$ENV_FILE" > .env
          chmod 600 .env

          if [ ! -s .env ]; then
            echo ".env was not created or is empty"
            exit 1
          fi

          if ! awk '
            /^[[:space:]]*($|#)/ { next }
            /^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=/ { next }
            { invalid=1; exit }
            END { exit invalid }
          ' .env; then
            echo ".env contains an invalid line; expected KEY=VALUE entries"
            exit 1
          fi

          for required_key in \
            SECRET_KEY \
            DEFAULT_DB_NAME \
            DEFAULT_DB_USER \
            DEFAULT_DB_PASSWORD \
            DEFAULT_DB_HOST \
            DEFAULT_DB_PORT \
            ACCESS_TOKEN_EXPIRE_TIME_IN_MIN \
            REFRESH_TOKEN_EXPIRE_TIME_IN_MIN \
            REDIS_HOST \
            REDIS_PORT; do
            if ! grep -Eq "^[[:space:]]*${required_key}=" .env; then
              echo "Missing required .env key: ${required_key}"
              exit 1
            fi
          done

          # Don't `git clean -ffdx`: it would try to delete the bind-mounted
          # ./media dir, whose contents are created by the root-running
          # containers and can't be removed by the runner user (EACCES). It
          # would also wipe user uploads on every deploy. Leave the workspace
          # untracked files (media/) in place.
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          sudo -n docker compose config --quiet
          sudo -n docker compose up -d --build --remove-orphans
          sudo -n docker compose ps
          sudo -n docker compose logs --tail=200
          sudo -n docker image prune -f

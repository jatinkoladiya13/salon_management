services:
  web:
    build:
      context: .
    image: salon-management:latest
    env_file:
      - .env
    environment:
      DEFAULT_DB_HOST: db
      DEFAULT_DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL: "1"
    command: daphne -b 0.0.0.0 -p 8000 salon_management.asgi:application
    ports:
      - "${WEB_PORT:-8001}:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: salon-management:latest
    env_file:
      - .env
    environment:
      DEFAULT_DB_HOST: db
      DEFAULT_DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL: "1"
    command: celery -A salon_management worker -l info --pool=solo
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: salon-management:latest
    env_file:
      - .env
    environment:
      DEFAULT_DB_HOST: db
      DEFAULT_DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL: "1"
    command: celery -A salon_management beat -l info
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  setup:
    image: salon-management:latest
    profiles:
      - setup
    env_file:
      - .env
    environment:
      DEFAULT_DB_HOST: db
      DEFAULT_DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL: "1"
    command:
      - sh
      - -c
      - python manage.py migrate_schemas --shared && python manage.py setup_project
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DEFAULT_DB_NAME:?Set DEFAULT_DB_NAME in .env}
      POSTGRES_USER: ${DEFAULT_DB_USER:?Set DEFAULT_DB_USER in .env}
      POSTGRES_PASSWORD: ${DEFAULT_DB_PASSWORD:?Set DEFAULT_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >-
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
      redis-server --requirepass "$${REDIS_PASSWORD}";
      else redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$${REDIS_PASSWORD}\"} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  media_data:
  static_data:
  postgres_data:
  redis_data:

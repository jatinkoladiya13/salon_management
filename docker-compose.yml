services:

  # ============================================================
  # Django / DRF / WebSocket application
  # ============================================================
  web:
    build:
      context: .

    image: salon-management:latest

    env_file:
      - .env

    environment:
      DEFAULT_DB_HOST: ${DEFAULT_DB_HOST}
      DEFAULT_DB_PORT: ${DEFAULT_DB_PORT:-5432}
    
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USE_TLS: ${REDIS_USE_TLS:-False}

    command:
      - sh
      - -c
      - |
        echo "Waiting for PostgreSQL..."
        until nc -z "$$DEFAULT_DB_HOST" "$$DEFAULT_DB_PORT"; do
          sleep 2
        done

        echo "Running shared migrations..."
        python manage.py migrate_schemas --shared

        echo "Running tenant migrations..."
        python manage.py migrate_schemas --tenant

        echo "Running project setup..."
        python manage.py setup_project

        echo "Collecting static files..."
        python manage.py collectstatic --noinput

        echo "Starting Daphne..."
        exec daphne \
          -b 0.0.0.0 \
          -p 8000 \
          salon_management.asgi:application

    ports:
      - "8001:8000"

    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "Host: 13.53.37.112",
          "http://127.0.0.1:8000/health/"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # Celery Worker
  # ============================================================
  worker:
    image: salon-management:latest

    env_file:
      - .env

    environment:
      DEFAULT_DB_HOST: ${DEFAULT_DB_HOST}
      DEFAULT_DB_PORT: ${DEFAULT_DB_PORT:-5432}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USE_TLS: ${REDIS_USE_TLS:-False}

    command:
      - celery
      - -A
      - salon_management
      - worker
      - -l
      - info

    restart: unless-stopped

  # ============================================================
  # Celery Beat
  # ============================================================
  beat:
    image: salon-management:latest

    env_file:
      - .env

    environment:
      DEFAULT_DB_HOST: ${DEFAULT_DB_HOST}
      DEFAULT_DB_PORT: ${DEFAULT_DB_PORT:-5432}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USE_TLS: ${REDIS_USE_TLS:-False}

    command:
      - celery
      - -A
      - salon_management
      - beat
      - -l
      - info

    restart: unless-stopped


  # ============================================================
  # Database setup / migrations
  # ============================================================
  setup:
    image: salon-management:latest

    profiles:
      - setup

    env_file:
      - .env

    environment:
      DEFAULT_DB_HOST: ${DEFAULT_DB_HOST}
      DEFAULT_DB_PORT: ${DEFAULT_DB_PORT:-5432}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USE_TLS: ${REDIS_USE_TLS:-False}

    command:
      - sh
      - -c
      - |
        echo "Waiting for PostgreSQL..."
        until nc -z "$$DEFAULT_DB_HOST" "$$DEFAULT_DB_PORT"; do
          sleep 2
        done

        echo "Running shared migrations..."
        python manage.py migrate_schemas --shared

        echo "Running tenant migrations..."
        python manage.py migrate_schemas --tenant

        echo "Running project setup..."
        python manage.py setup_project

        echo "Collecting static files..."
        python manage.py collectstatic --noinput

    volumes:
      - static_data:/app/staticfiles

  # ============================================================
  # Nginx
  # ============================================================  
  nginx:
    image: nginx:1.27-alpine

    depends_on:
      web:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

    restart: unless-stopped


# ==============================================================
# Persistent Docker volumes
# ==============================================================
volumes:
  media_data:
  static_data: